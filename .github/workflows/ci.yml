# Lean hosted CI for this vendored copy of dsh.
#
# Upstream's enterprise lanes (static, coverage, consumers, native Windows,
# wine gates, runner benchmarks) are pull-request-only and pinned to runner
# labels and pools that exist only in the upstream organisation
# (`dsh-ubuntu-24-04-16core`, `dsh-windows-2025-16core`, and the self-hosted
# `vm-backup` / `dsh-win-ci` standby drills). This repository merges directly
# to master and has no such runners, so those lanes could neither run nor
# pass here: every push run queued the two standby drills forever and ended
# cancelled (e.g. run 40479747009), with every hosted job skipped.
#
# The two jobs below are the verification this account can honestly run on
# standard GitHub-hosted runners: the full unit suite (`vitest run` — the
# same suite the Sandbox seatbelt leg runs for darwin parity) and the
# complete keyless Python SDK suite. The GitHub starter workflows that could
# never pass here (NodeJS with Webpack — no webpack build exists; Run
# Datadog Synthetic tests — no DD_API_KEY/DD_APP_KEY secrets) were removed.
#
# The hosted images' preinstalled pwsh is hidden before the unit suite: the
# persistent-pwsh driver's interactive echo/readiness protocol breaks on
# current GitHub-hosted pwsh (7.5+) identically on ubuntu and macOS, so the
# runner is effectively pwsh-less for these suites. That flips the suites'
# own `describe.skipIf(!hasPwsh)` degradation path — the exact mechanism
# upstream built for pwsh-less hosts (see docs/testing.md) — instead of
# pinning a fragile exclusion list in CI. Devs with a compatible local pwsh
# still run them.
#
# scripts/ci-workflow.spec.ts pins this contract; keep the two in sync.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  node-24-unit:
    name: node 24 / unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          # Isolated per-runner destination (pinned by scripts/ci-workflow.spec.ts).
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # Hosted images ship pwsh 7.5+, whose interactive semantics break the
      # persistent-pwsh driver (see the header). Hiding it engages the
      # suites' own designed skipIf degradation for pwsh-less hosts.
      - name: Hide preinstalled pwsh (driver-incompatible on hosted images)
        run: |
          target="$(command -v pwsh || true)"
          if [ -n "$target" ]; then
            sudo mv "$target" "$target.disabled"
            echo "hid pwsh at $target"
          else
            echo "pwsh already absent"
          fi

      - name: Unit tests
        run: pnpm run test

  python-sdk:
    name: python 3.10 / keyless SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest
